name: Build and Generate

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
    inputs:
      update_ip_lists:
        description: Update ip-lists after all checks succeed
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '45 2 * * *'

concurrency:
  group: china-asset-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  prepare-inputs:
    needs: check
    if: |
      github.ref == 'refs/heads/master' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.update_ip_lists)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - uses: extractions/setup-just@v3
      - name: Download complete BGP and WHOIS snapshots
        working-directory: source
        run: just dependency prepare
      - name: Upload RIS 00-03 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-00-03
          path: |
            source/data/bgp/rib-rrc00.*
            source/data/bgp/rib-rrc01.*
            source/data/bgp/rib-rrc03.*
          compression-level: 0
          retention-days: 1
      - name: Upload RIS 04-06 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-04-06
          path: |
            source/data/bgp/rib-rrc04.*
            source/data/bgp/rib-rrc05.*
            source/data/bgp/rib-rrc06.*
          compression-level: 0
          retention-days: 1
      - name: Upload RIS 07-11 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-07-11
          path: |
            source/data/bgp/rib-rrc07.*
            source/data/bgp/rib-rrc10.*
            source/data/bgp/rib-rrc11.*
          compression-level: 0
          retention-days: 1
      - name: Upload RIS 12-14 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-12-14
          path: |
            source/data/bgp/rib-rrc12.*
            source/data/bgp/rib-rrc13.*
            source/data/bgp/rib-rrc14.*
          compression-level: 0
          retention-days: 1
      - name: Upload RIS 15-18 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-15-18
          path: |
            source/data/bgp/rib-rrc15.*
            source/data/bgp/rib-rrc16.*
            source/data/bgp/rib-rrc18.*
          compression-level: 0
          retention-days: 1
      - name: Upload RIS 19-21 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-19-21
          path: |
            source/data/bgp/rib-rrc19.*
            source/data/bgp/rib-rrc20.*
            source/data/bgp/rib-rrc21.*
          compression-level: 0
          retention-days: 1
      - name: Upload RIS 22-24 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-22-24
          path: |
            source/data/bgp/rib-rrc22.*
            source/data/bgp/rib-rrc23.*
            source/data/bgp/rib-rrc24.*
          compression-level: 0
          retention-days: 1
      - name: Upload RIS 25-26 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-ris-25-26
          path: |
            source/data/bgp/rib-rrc25.*
            source/data/bgp/rib-rrc26.*
          compression-level: 0
          retention-days: 1
      - name: Upload RouteViews 2 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-route-views2
          path: source/data/bgp/rib-route-views2.*
          compression-level: 0
          retention-days: 1
      - name: Upload RouteViews 6 BGP inputs
        uses: actions/upload-artifact@v4
        with:
          name: bgp-inputs-route-views6
          path: source/data/bgp/rib-route-views6.*
          compression-level: 0
          retention-days: 1
      - name: Upload immutable WHOIS inputs
        uses: actions/upload-artifact@v4
        with:
          name: whois-inputs
          path: source/data/whois
          compression-level: 0
          retention-days: 1

  extract-bgp:
    needs: prepare-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source_group:
          - name: ris-00-03
            collectors: rrc00 rrc01 rrc03
            artifact: bgp-inputs-ris-00-03
            index: 0
          - name: ris-04-06
            collectors: rrc04 rrc05 rrc06
            artifact: bgp-inputs-ris-04-06
            index: 1
          - name: ris-07-11
            collectors: rrc07 rrc10 rrc11
            artifact: bgp-inputs-ris-07-11
            index: 2
          - name: ris-12-14
            collectors: rrc12 rrc13 rrc14
            artifact: bgp-inputs-ris-12-14
            index: 3
          - name: ris-15-18
            collectors: rrc15 rrc16 rrc18
            artifact: bgp-inputs-ris-15-18
            index: 4
          - name: ris-19-21
            collectors: rrc19 rrc20 rrc21
            artifact: bgp-inputs-ris-19-21
            index: 5
          - name: ris-22-24
            collectors: rrc22 rrc23 rrc24
            artifact: bgp-inputs-ris-22-24
            index: 6
          - name: ris-25-26
            collectors: rrc25 rrc26
            artifact: bgp-inputs-ris-25-26
            index: 7
          - name: route-views2
            collectors: route-views2
            artifact: bgp-inputs-route-views2
            index: 8
          - name: route-views6
            collectors: route-views6
            artifact: bgp-inputs-route-views6
            index: 9
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - name: Download prepared BGP snapshots
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.source_group.artifact }}
          path: source/data/bgp
      - name: Extract deterministic BGP Prefix shard
        working-directory: source
        env:
          BGP_COLLECTORS: ${{ matrix.source_group.collectors }}
          BGP_GROUP_NAME: ${{ matrix.source_group.name }}
          BGP_SOURCE_GROUP_INDEX: ${{ matrix.source_group.index }}
          BGP_SOURCE_GROUP_COUNT: 10
          CARGO_BUILD_JOBS: 2
        run: just extract_bgp ${{ matrix.shard }} 4
      - name: Upload BGP shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgp-shard-${{ matrix.source_group.name }}-${{ matrix.shard }}
          path: source/artifacts/bgp-shard-${{ matrix.source_group.name }}-${{ matrix.shard }}.json
          compression-level: 0
          retention-days: 1

  merge-generate:
    needs: extract-bgp
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ip-lists
          path: source/ip-lists
      - uses: dtolnay/rust-toolchain@stable
      - uses: extractions/setup-just@v3
      - name: Install guard dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Download prepared RIR WHOIS snapshots
        uses: actions/download-artifact@v4
        with:
          name: whois-inputs
          path: source/data/whois
      - name: Download all BGP shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bgp-shard-*
          path: source/artifacts
          merge-multiple: true
      - name: Merge shards and generate complete database
        working-directory: source
        env:
          CARGO_BUILD_JOBS: 2
        run: just merge_generate
      - name: Validate BGP-only output invariant
        working-directory: source
        run: just guard
      - name: Publish ip-lists atomically
        working-directory: source
        run: just upload
      - name: Refresh jsDelivr
        working-directory: source
        run: just refresh_jsdelivr "${{ github.repository }}"
      - name: Publish updated ip-lists
        working-directory: source
        run: gh workflow run publish-ip-lists-pages.yml --ref master
