name: Build and Generate

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
    inputs:
      update_ip_lists:
        description: Update ip-lists after all checks succeed
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '45 2 * * *'

concurrency:
  group: china-asset-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  generate:
    needs: check
    if: |
      github.ref == 'refs/heads/master' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.update_ip_lists)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
      - uses: actions/checkout@v6
        with:
          ref: ip-lists
          path: source/ip-lists
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - uses: extractions/setup-just@v3
      - name: Install guard dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - uses: actions/cache@v5
        with:
          path: |
            source/data/bgp
            source/data/whois
          key: network-assets-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            network-assets-${{ runner.os }}-
      - name: Generate complete staged database
        working-directory: source
        run: just generate
      - name: Validate BGP-only output invariant
        working-directory: source
        run: just guard
      - name: Publish ip-lists atomically
        working-directory: source
        run: just upload
      - name: Refresh jsDelivr
        working-directory: source
        run: just refresh_jsdelivr "${{ github.repository }}"
      - name: Publish updated ip-lists
        working-directory: source
        run: gh workflow run publish-ip-lists-pages.yml --ref master
