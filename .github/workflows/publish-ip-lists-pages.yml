name: Publish ip-lists to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: publish-ip-lists-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish static ip-lists site
    steps:
      - name: Checkout ip-lists
        uses: actions/checkout@v6
        with:
          ref: ip-lists

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install --yes tree

      - name: Prepare Pages site
        run: |
          mkdir site
          find . -maxdepth 1 -type f \
            ! -name 'prefix-asn.jsonl' \
            ! -name 'prefix-owner.jsonl' \
            ! -name 'prefix-path.jsonl' \
            -exec cp -- {} site/ \;

      - name: Generate directory index
        working-directory: site
        run: tree -H . -P "*.txt|*.json|stat" --ignore-case --noreport -T "China Operator IP - prebuild results" -o index.html .

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --commit-dirty=true
