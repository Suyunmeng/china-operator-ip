name: Publish ip-lists to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: publish-ip-lists-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish static ip-lists site
    steps:
      - name: Checkout page generator
        uses: actions/checkout@v6
        with:
          path: generator

      - name: Checkout ip-lists
        uses: actions/checkout@v6
        with:
          ref: ip-lists
          path: ip-lists

      - name: Prepare Pages site
        run: python generator/scripts/generate_pages_index.py ip-lists site

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --commit-dirty=true
