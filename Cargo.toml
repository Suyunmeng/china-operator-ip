[package]
name = "china-asset-pipeline"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
bgpkit-parser = { version = "0.12", default-features = false, features = ["local"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
ipnet = { version = "2.11", features = ["serde"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.20"
